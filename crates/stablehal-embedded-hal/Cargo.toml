[package]
name = "stablehal-embedded-hal"
description = "Bridge between StableHAL's contract-aware HAL traits and the Rust embedded-hal ecosystem. Adapts embedded-hal traits (embedded_hal::i2c, embedded_hal::spi, embedded-io serial) so they can be exercised by StableHAL's sim, judged by StableHAL's oracles, and certified against StableHAL's contracts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
stablehal-contract = { workspace = true }
stablehal-uart = { workspace = true }
stablehal-i2c = { workspace = true }
stablehal-spi = { workspace = true, optional = true }
stablehal-can = { workspace = true, optional = true }
embedded-hal = "1.0"
embedded-io = "0.6"
embedded-can = "0.4"

[features]
default = ["spi", "can"]
spi = ["stablehal-spi"]
can = ["stablehal-can"]
